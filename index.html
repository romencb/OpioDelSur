<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager</title>
  </head>
  <body>
    <script>
      // AGGRESSIVE CACHE WIPE: Destroys the corrupted ghost draft
      localStorage.clear();
      sessionStorage.clear();
      ['netlify-cms-user', 'netlify-cms-drafts', 'localforage', 'decap-cms-user', 'decap-cms-drafts'].forEach(db => {
        try { window.indexedDB.deleteDatabase(db); } catch(e) {}
      });
      window.CMS_MANUAL_INIT = true;
    </script>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    
    <script>
      CMS.init({
        config: {
          site_url: 'https://elopiodelsur.netlify.app',
          backend: {
            name: 'github',
            repo: 'romencb/ElOpioDelSur',
            branch: 'main',
            auth_type: 'pkce',
            base_url: 'https://auth.decapbridge.com',
            auth_endpoint: '/sites/9382f8ca-10e2-45ee-834a-68c6e79bbaee/pkce',
            auth_token_endpoint: '/sites/9382f8ca-10e2-45ee-834a-68c6e79bbaee/token',
            gateway_url: 'https://gateway.decapbridge.com'
          },
          media_folder: 'images',
          public_folder: '/images',
          collections: [
            {
              name: 'articles',
              label: 'Articles',
              folder: '_articles',
              create: true,
              slug: '{{year}}-{{month}}-{{day}}-{{slug}}',
              fields: [
                { label: 'Title', name: 'title', widget: 'string' },
                { label: 'Publish Date', name: 'date', widget: 'datetime' },
                { label: 'Body', name: 'body', widget: 'markdown' }
              ]
            }
          ]
        }
      });
    </script>
  </body>
</html>
