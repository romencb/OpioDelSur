<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager</title>
  </head>
  <body>
    <!-- This script prevents the CMS from looking for a config.yml file -->
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
    <!-- Load Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    
    <!-- Initialize the CMS with inline configuration -->
    <script>
      CMS.init({
        config: {
          backend: {
            name: 'github',
            repo: 'romencb/ElOpioDelSur' // Change this to your actual username and repo
          },
          media_folder: 'images',
          public_folder: '/images',
          collections: [
            {
              name: 'articles',
              label: 'Articles',
              folder: '_articles',
              create: true,
              slug: '{{year}}-{{month}}-{{day}}-{{slug}}',
              fields: [
                { label: 'Title', name: 'title', widget: 'string' },
                { label: 'Publish Date', name: 'date', widget: 'datetime' },
                { label: 'Body', name: 'body', widget: 'markdown' }
              ]
            }
          ]
        }
      });
    </script>
  </body>
</html>
